  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Full-page starfield (dimmed) ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0.35;
      background-image: var(--stars-hub);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #000;
      color: #e8e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: transparent;
      padding: 64px 32px 48px;
      position: relative;
      z-index: 1;
      text-align: center;
    }

    header h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 3.2rem;
      font-weight: 900;
      letter-spacing: 6px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ffe81f 0%, #fff7a0 50%, #ffe81f 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 18px rgba(255,232,31,0.35));
    }

    header h1::after {
      content: '';
      display: block;
      width: 90px;
      height: 3px;
      margin: 18px auto 0;
      border-radius: 2px;
      background: linear-gradient(90deg, transparent, #ffe81f, transparent);
    }

    main {
      padding: 0 32px 60px;
      flex: 1;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 14px;
      padding: 20px 22px;
      text-decoration: none;
      color: inherit;
      display: grid;
      grid-template-columns: auto 1fr;
      column-gap: 16px;
      align-items: center;
      min-height: 96px;
      text-align: left;
      transition: all 0.2s ease;
      backdrop-filter: blur(2px);
    }

    .card:hover {
      border-color: rgba(255,255,255,0.4);
      transform: translateY(-2px);
      background: rgba(255,255,255,0.05);
    }

    .card-icon {
      grid-row: 1 / span 2;
      font-size: 2rem;
      line-height: 1;
    }
    /* brand-logo card icons — uniform 54px tiles */
    img.card-icon {
      width: 54px;
      height: 54px;
      box-sizing: border-box;
      object-fit: cover;
      border-radius: 12px;
    }

    .card-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #ffe81f;
    }

    .card-sub {
      margin-top: 5px;
      font-size: 0.76rem;
      line-height: 1.5;
      color: #8a8899;
      min-height: 1em;
    }
    .card-sub .hot { color: #d9dcea; font-weight: 600; }
    .card-sub .soon { color: #d9dcea; font-weight: 600; }
    .card-sub .dot {
      display: inline-block; width: 7px; height: 7px; border-radius: 50%;
      background: #4ade80; margin-right: 5px; vertical-align: 1px;
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 0.72rem;
      color: #444;
      position: relative;
      z-index: 1;
    }

    @media (max-width: 600px) {
      .grid {
        grid-template-columns: 1fr;
        gap: 12px;
      }
      .card {
        display: grid;
        grid-template-columns: auto 1fr;
        column-gap: 16px;
        align-items: center;
        height: auto;
        min-height: 0;
        padding: 16px 18px;
        text-align: left;
      }
      .card-icon {
        grid-row: 1 / span 2;
        font-size: 2rem;
        margin-bottom: 0;
      }
      .card-title {
        font-size: 0.92rem;
      }
      .card-sub {
        margin-top: 4px;
        min-height: 0;
      }
    }

    @media (max-width: 480px) {
      header {
        padding: 40px 16px 32px;
      }
      header h1 {
        font-size: 2rem;
        letter-spacing: 3px;
      }
      main {
        padding: 0 16px 40px;
      }
    }
  </style>
</head>

(function(){
  var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone;
  var s = document.getElementById('pwa-splash');
  if(!s) return;
  if(!standalone){ s.remove(); return; }
  s.style.display='flex';
  function hide(){ s.style.opacity='0'; setTimeout(function(){ if(s) s.remove(); }, 550); }
  window.addEventListener('load', function(){ setTimeout(hide, 350); });
  setTimeout(hide, 4000);
})();
</script>

<script>
(async function retroTeaser() {
  const el = document.getElementById('retro-sub');
  if (!el || typeof RETRO_FILMS === 'undefined') return;
  try {
    const films = RETRO_FILMS.map(f => ({ id: f.id, title: f.title }));
    if (!films.length) return;

    let watched = {};
    try {
      const j = await (await fetch('https://api.github.com/gists/5411ac8d12fdc31aa3fa73e4d66f6377', { cache:'no-store' })).json();
      watched = JSON.parse(j.files['watchlist.json'].content);
    } catch (_) {
      watched = RETRO_LETTERBOXD;
    }

    const isWatched = f => typeof watched[f.id] === 'string';
    const done = films.filter(isWatched).length;
    const left = films.filter(f => !isWatched(f));

    const line1 = '<span class="soon">' + done + '/' + films.length + ' watched</span> · ' + left.length + ' to go';
    let line2 = '';
    if (left.length) {
      const seed = +new Date().toISOString().slice(0,10).replace(/-/g,'');
      const pick = left[seed % left.length];
      line2 = "Claude's pick: <span class=\"hot\">" + pick.title + '</span>';
    } else {
      line2 = 'all watched — legend 🏆';
    }
    el.innerHTML = line1 + '<br>' + line2;
  } catch (_) {}
})();
</script>
<script>
(function showsTeaser() {
  const el = document.getElementById('shows-sub');
  if (!el || typeof SHOWS === 'undefined') return;
  try {
    const now = new Date();
    const ymd = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    const today = ymd(now);

    const MONTHS = { Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11 };
    const ord = n => n + (n%10===1&&n%100!==11?'st':n%10===2&&n%100!==12?'nd':n%10===3&&n%100!==13?'rd':'th');
    const dateLabel = iso => { const d = new Date(iso + 'T00:00:00'); return ord(d.getDate()) + ' ' + d.toLocaleString('en-GB',{month:'short'}); };
    const joinTitles = (arr, cap=3) => {
      const shown = arr.slice(0, cap);
      const s = shown.length <= 1 ? (shown[0] || '')
              : shown.slice(0,-1).join(', ') + ' & ' + shown[shown.length-1];
      const extra = arr.length - shown.length;
      return s + (extra > 0 ? ' +' + extra : '');
    };

    // Explicitly flagged as currently airing.
    const nowNames = SHOWS.filter(s => s.airing && s.airingUntil && s.airingUntil >= today).map(s => s.name);

    // Only shows with a full, confirmed date (D Mon YYYY) group into coming-soon lines.
    const groups = [];
    SHOWS.forEach(s => {
      const m = s.next && s.next.match(/(\d{1,2})\s+(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\s+(\d{4})/);
      if (!m) return;
      const iso = m[3] + '-' + String(MONTHS[m[2]]+1).padStart(2,'0') + '-' + String(+m[1]).padStart(2,'0');
      const season = (s.next.match(/^(S\d+)/) || [,''])[1];
      const title = s.name + (season ? ' ' + season : '');
      if (iso <= today) {
        // Premiere date has arrived but the show isn't flagged airing yet (data not
        // refreshed since it dropped) — treat as streaming now, like a released film.
        if (!s.airing && !nowNames.includes(s.name)) nowNames.push(s.name);
        return;
      }
      const g = groups.find(x => x.date === iso);
      if (g) g.titles.push(title); else groups.push({ date: iso, titles: [title] });
    });
    groups.sort((a,b) => a.date.localeCompare(b.date));

    const soonLine = g => dateLabel(g.date) + ': <span class="soon">' + joinTitles(g.titles) + '</span>';

    let line1 = '', line2 = '';
    if (nowNames.length) {
      line1 = '<span class="dot"></span><span class="hot">Airing now: ' + joinTitles(nowNames) + '</span>';
      if (groups[0]) line2 = soonLine(groups[0]);
    } else if (groups.length) {
      line1 = soonLine(groups[0]);
      if (groups[1]) line2 = soonLine(groups[1]);
    }
    el.innerHTML = [line1, line2].filter(Boolean).join('<br>');
  } catch (_) {}
})();

(function filmsTeaser() {
  const el = document.getElementById('films-sub');
  if (!el || typeof FILMS === 'undefined') return;
  try {
    const now = new Date();
    const ymd = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    const today = ymd(now);

    const ord = n => n + (n%10===1&&n%100!==11?'st':n%10===2&&n%100!==12?'nd':n%10===3&&n%100!==13?'rd':'th');
    const dateLabel = iso => { const d = new Date(iso + 'T00:00:00'); return ord(d.getDate()) + ' ' + d.toLocaleString('en-GB',{month:'short'}); };
    const joinTitles = (arr, cap=3) => {
      const shown = arr.slice(0, cap);
      const s = shown.length <= 1 ? (shown[0] || '')
              : shown.slice(0,-1).join(', ') + ' & ' + shown[shown.length-1];
      const extra = arr.length - shown.length;
      return s + (extra > 0 ? ' +' + extra : '');
    };
    const groupByDate = list => {
      const map = new Map();
      list.forEach(f => { if (!map.has(f.vodDate)) map.set(f.vodDate, []); map.get(f.vodDate).push(f.title); });
      return [...map.entries()].sort((a,b) => a[0].localeCompare(b[0])).map(([date, titles]) => ({ date, titles }));
    };

    // Exclude pre-theatrical cinema-only entries — their date is the cinema release, not VOD availability.
    const vod      = FILMS.filter(f => f.vodDate && f.cinema !== true);
    // "Available now" stays confirmed-only (don't promise an estimate as already out).
    const availNow = vod.filter(f => f.vodDate <= today && f.estimated !== true)
                        .sort((a,b) => b.vodDate.localeCompare(a.vodDate));
    // Coming-soon groups include estimated dates.
    const upcoming = groupByDate(vod.filter(f => f.vodDate > today));

    const soonLine = g => dateLabel(g.date) + ': <span class="soon">' + joinTitles(g.titles) + '</span>';

    let line1 = '', line2 = '';
    if (availNow.length) {
      line1 = '<span class="dot"></span><span class="hot">Available now: ' + joinTitles(availNow.map(f => f.title)) + '</span>';
      if (upcoming[0]) line2 = soonLine(upcoming[0]);
    } else if (upcoming.length) {
      line1 = soonLine(upcoming[0]);
      if (upcoming[1]) line2 = soonLine(upcoming[1]);
    } else {
      line1 = FILMS.length + ' tracked · no dates confirmed yet';
    }
    el.innerHTML = [line1, line2].filter(Boolean).join('<br>');
  } catch (_) { /* leave blank on any hiccup */ }
})();

(async function worldCupTeaser() {
  const el = document.getElementById('wc-sub');
  if (!el) return;
  try {
    const j = await (await fetch('https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard?dates=20260611-20260719&limit=200')).json();
    const now = new Date();
    const events = j.events || [];

    // ── End of tournament: show the champion + Golden Boot instead of fixtures ──
    const stateOf = e => (e.status && e.status.type && e.status.type.state) || '';
    const final = events.find(e => e.season && e.season.slug === 'final');

    // Golden Boot: tally every scoring play across the tournament.
    // Own goals and shootout penalties don't count towards the award.
    const topScorer = () => {
      const tally = {};
      events.forEach(e => {
        ((e.competitions && e.competitions[0] && e.competitions[0].details) || []).forEach(d => {
          if (!d.scoringPlay || d.ownGoal || d.shootout) return;
          (d.athletesInvolved || []).slice(0, 1).forEach(a => {
            const key = a.displayName || a.fullName;
            if (key) tally[key] = (tally[key] || 0) + 1;
          });
        });
      });
      const ranked = Object.entries(tally).sort((a, b) => b[1] - a[1]);
      if (!ranked.length || ranked[0][1] === 0) return null;
      const top = ranked[0][1];
      const tied = ranked.filter(r => r[1] === top);
      return { name: tied[0][0], goals: top, shared: tied.length - 1 };
    };

    if (final && stateOf(final) === 'post') {
      const c = final.competitions[0].competitors;
      const win = c.find(x => x.winner) || c[0];
      const lose = c.find(x => x !== win);
      const score = win.score + '–' + lose.score;
      const shootout = (final.competitions[0].details || []).some(d => d.shootout);
      let line1 = '<span class="hot">CHAMPIONS: ' + win.team.displayName + '</span> · beat ' +
                  lose.team.shortDisplayName + ' ' + score + (shootout ? ' (pens)' : '');
      const gb = topScorer();
      const line2 = gb
        ? 'Golden Boot: <span class="soon">' + gb.name + '</span> · ' + gb.goals + ' goals' +
          (gb.shared ? ' (shared +' + gb.shared + ')' : '')
        : '';
      el.innerHTML = [line1, line2].filter(Boolean).join('<br>');
      return;
    }

    // Final kicked off but not finished — show it live.
    if (final && stateOf(final) === 'in') {
      const c = final.competitions[0].competitors;
      const h = c.find(x => x.homeAway === 'home'), a = c.find(x => x.homeAway === 'away');
      const st = final.status.type.detail || final.status.type.description || 'Live';
      el.innerHTML = '<span class="dot"></span><span class="hot">FINAL LIVE</span> · ' +
                     h.team.shortDisplayName + ' ' + h.score + '–' + a.score + ' ' +
                     a.team.shortDisplayName + '<br><span class="soon">' + st + '</span>';
      return;
    }

    const games = events
      .filter(e => new Date(e.date) > now && e.status && e.status.type && e.status.type.state === 'pre')
      .map(e => {
        let label = e.shortName || e.name || '';
        try {
          const c = e.competitions[0].competitors;
          const h = c.find(x => x.homeAway === 'home'), a = c.find(x => x.homeAway === 'away');
          label = h.team.shortDisplayName + ' v ' + a.team.shortDisplayName;
        } catch (_) {}
        return { d: new Date(e.date), label };
      })
      .sort((a,b) => a.d - b.d)
      .slice(0, 2);
    if (!games.length) return;

    const fmt = g => {
      const days = Math.round((new Date(g.d.getFullYear(), g.d.getMonth(), g.d.getDate()) -
                               new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 86400000);
      const time = g.d.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
      const when = days === 0 ? 'today ' + time
                 : days === 1 ? 'tomorrow ' + time
                 : days + ' days';
      return '<span class="soon">' + g.label + '</span> · ' + when;
    };
    el.innerHTML = games.map((g, i) => (i === 0 ? 'next: ' : 'then: ') + fmt(g)).join('<br>');
  } catch (_) {}
})();

(async function lineupTeaser() {
  const el = document.getElementById('lineup-sub');
  if (!el) return;
  const LABEL = { france: 'FRA', liverpool: 'LIV' };

  // Squad availability — read from the lineup builder's synced gist state
  // (c = conditions keyed by player id, ps = section: 'squad' = main squad)
  const availP = (async () => {
    try {
      const j = await (await fetch('https://api.github.com/gists/5411ac8d12fdc31aa3fa73e4d66f6377', { cache:'no-store' })).json();
      const data = JSON.parse(j.files['watchlist.json'].content);
      const counts = key => {
        const st = data[key];
        if (!st || !st.c) return null;
        let inj = 0, sus = 0, away = 0;
        Object.entries(st.c).forEach(([id, c]) => {
          if (!st.ps || !(id in st.ps)) return; // only players still in the squad (skips departed/stale ids); matches lineup page (incl. fringe)
          if (c === 'injured') inj++; else if (c === 'suspended') sus++; else if (c === 'away') away++;
        });
        return { inj, sus, away };
      };
      return { france: counts('lineup_france'), liverpool: counts('lineup_liverpool') };
    } catch (_) { return null; }
  })();

  // Next scheduled game — Liverpool (domestic + European) and France (post-World-Cup:
  // Nations League, qualifiers, friendlies). ESPN's per-team `nextEvent` endpoint
  // returns an empty array in some regions, so instead read each league's scoreboard
  // over a rolling date window and match by team name.
  const nextP = (async () => {
    const games = [];
    const now = new Date();
    const pad = n => String(n).padStart(2, '0');
    const ymd = d => d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate());
    const end = new Date(now); end.setDate(end.getDate() + 150);
    const range = ymd(now) + '-' + ymd(end);
    const compName = e => {
      try {
        const c = e.competitions[0].competitors;
        const h = c.find(x => x.homeAway === 'home'), a = c.find(x => x.homeAway === 'away');
        return h.team.shortDisplayName + ' v ' + a.team.shortDisplayName;
      } catch (_) { return e.shortName || e.name || ''; }
    };
    const pull = async (team, league, re) => {
      try {
        const j = await (await fetch('https://site.api.espn.com/apis/site/v2/sports/soccer/' + league +
                                     '/scoreboard?dates=' + range + '&limit=300')).json();
        (j.events || []).forEach(e => {
          const d = new Date(e.date);
          if (d > now && re.test(e.name || '')) games.push({ d, team, label: compName(e) });
        });
      } catch (_) {}
    };
    const LFC = /liverpool/i, FRA = /france/i;
    await Promise.all([
      pull('liverpool', 'eng.1', LFC),
      pull('liverpool', 'uefa.champions', LFC),
      pull('liverpool', 'eng.fa', LFC),
      pull('liverpool', 'eng.league_cup', LFC),
      pull('liverpool', 'club.friendly', LFC),
      pull('france', 'uefa.nations', FRA),
      pull('france', 'fifa.worldq.uefa', FRA),
      pull('france', 'fifa.friendly', FRA),
      pull('france', 'fifa.world', FRA),
    ]);
    // De-dupe (a match can surface in overlapping feeds), then take the soonest.
    const seen = new Set();
    return games
      .filter(g => { const k = +g.d + '|' + g.label; if (seen.has(k)) return false; seen.add(k); return true; })
      .sort((a, b) => a.d - b.d)[0] || null;
  })();

  const [avail, nxt] = await Promise.all([availP, nextP]);

  let nextLine = '', availLine = '';
  if (nxt) {
    const now = new Date();
    const days = Math.round((new Date(nxt.d.getFullYear(), nxt.d.getMonth(), nxt.d.getDate()) -
                             new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 86400000);
    const time = nxt.d.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
    const when = days === 0 ? 'today ' + time
               : days === 1 ? 'tomorrow ' + time
               : days + ' days';
    nextLine = 'next: <span class="soon">' + nxt.label + '</span> · ' + when;

    // Availability for the team playing next only
    const c = avail && avail[nxt.team];
    if (c) {
      const bits = [];
      if (c.inj) bits.push('<span style="color:#f87171">' + c.inj + ' injured</span>');
      if (c.sus) bits.push('<span style="color:#fb923c">' + c.sus + ' suspended</span>');
      if (c.away) bits.push('<span style="color:#60a5fa">' + c.away + ' away</span>');
      availLine = LABEL[nxt.team] + ': ' + (bits.length ? bits.join(', ') : '<span class="hot">all fit</span>');
    }
  }
  el.innerHTML = [nextLine, availLine].filter(Boolean).join('<br>');
})();
</script>

  <!-- Web Push opt-in: subscribes this installed app and stores the push
       subscription in the (public) gist so the GitHub Action can send to it.
       Must be done from the Home Screen app, not a Safari tab. -->
  <script>
  (function () {
    var VAPID_PUBLIC = 'BOXxcVQCiYh5lc0vydERBmY4EOJRWiIdOyPopYAArut3QRFuDDTUazA3nbRTrcaylYX_fBTZfWAdEXiNRDlKIOo';
    var GIST_ID = '5411ac8d12fdc31aa3fa73e4d66f6377';
    var SUB_FILE = 'push-subscription.json';
    var row = document.getElementById('push-row');
    if (!row) return;
    if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) return;

    function b64ToU8(base64) {
      var pad = '='.repeat((4 - base64.length % 4) % 4);
      var b64 = (base64 + pad).replace(/-/g, '+').replace(/_/g, '/');
      var raw = atob(b64), arr = new Uint8Array(raw.length);
      for (var i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
      return arr;
    }
    function status(txt) {
      row.innerHTML = '<span style="color:#8a8899;font-size:0.72rem">' + txt + '</span>';
    }
    function button(label, fn) {
      row.innerHTML = '<button style="background:rgba(255,232,31,0.12);border:1px solid rgba(255,232,31,0.4);' +
        'color:#ffe81f;padding:7px 16px;border-radius:100px;font-size:0.75rem;cursor:pointer">' + label + '</button>';
      row.firstChild.onclick = fn;
    }
    function getToken() {
      var t = localStorage.getItem('gistToken');
      if (!t) { t = prompt('Paste GitHub gist token (stored only in this browser):', '') || ''; if (t) localStorage.setItem('gistToken', t); }
      return t;
    }
    async function saveSubscription(sub) {
      var t = getToken();
      if (!t) throw new Error('token needed');
      var H = { 'Authorization': 'token ' + t, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' };
      var list = [];
      try {
        var j = await (await fetch('https://api.github.com/gists/' + GIST_ID, { cache: 'no-store' })).json();
        if (j.files && j.files[SUB_FILE]) { list = JSON.parse(j.files[SUB_FILE].content) || []; if (!Array.isArray(list)) list = [list]; }
      } catch (_) {}
      var s = sub.toJSON();
      list = list.filter(function (x) { return x.endpoint !== s.endpoint; });
      list.push(s);
      var body = {}; body.files = {}; body.files[SUB_FILE] = { content: JSON.stringify(list) };
      var res = await fetch('https://api.github.com/gists/' + GIST_ID, { method: 'PATCH', headers: H, body: JSON.stringify(body) });
      if (res.status !== 200) throw new Error('gist save failed (' + res.status + ')');
    }
    async function enable() {
      try {
        status('Enabling…');
        var reg = await navigator.serviceWorker.ready;
        var perm = await Notification.requestPermission();
        if (perm !== 'granted') { status('Notifications not allowed — enable them for this app in Settings'); return; }
        var sub = await reg.pushManager.getSubscription();
        if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToU8(VAPID_PUBLIC) });
        await saveSubscription(sub);
        status('✓ Date alerts on for this device');
      } catch (e) {
        button('Try again', enable);
        var note = document.createElement('div');
        note.style.cssText = 'color:#8a8899;font-size:0.68rem;margin-top:6px';
        note.textContent = String(e && e.message || e).indexOf('token') > -1
          ? 'Needs your gist token.' : "Couldn't enable (open from your Home Screen icon, not Safari).";
        row.appendChild(note);
      }
    }
    (async function init() {
      try {
        var reg = await navigator.serviceWorker.ready;
        var sub = reg.pushManager && await reg.pushManager.getSubscription();
        if (sub && Notification.permission === 'granted') { status('✓ Date alerts on'); return; }
      } catch (_) {}
      button('Enable date alerts', enable);
    })();
  })();
  </script>
