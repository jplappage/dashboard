<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poster Gallery</title>
<style>
  @font-face { font-family: "Bebas Neue"; src: url("../fonts/bebas-neue-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; src: url("../fonts/inter-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
  @font-face { font-family: "Inter"; src: url("../fonts/inter-latin-600-normal.woff2") format("woff2"); font-weight: 600; }
  :root {
    --bg: #0c0b0a;
    --panel: #16140f;
    --ink: #f5f0e4;
    --muted: rgba(245, 240, 228, 0.6);
    --gold: #f2c14e;
    --line: rgba(242, 193, 78, 0.22);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font-family: "Inter", system-ui, sans-serif; }
  header {
    position: sticky; top: 0; z-index: 5;
    background: rgba(12, 11, 10, 0.92); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
    padding: 14px 16px 0;
  }
  .top { max-width: 1400px; margin: 0 auto; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-family: "Bebas Neue", sans-serif; font-weight: 400; font-size: 34px; letter-spacing: 0.04em; color: var(--gold); }
  .search {
    flex: 1 1 200px; max-width: 320px;
    background: var(--panel); border: 1px solid var(--line); color: var(--ink);
    border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 14px;
  }
  .search::placeholder { color: var(--muted); }
  nav { max-width: 1400px; margin: 10px auto 0; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  nav::-webkit-scrollbar { display: none; }
  nav button {
    flex: none; background: none; border: none; color: var(--muted);
    font: inherit; font-size: 14px; font-weight: 600; padding: 8px 10px 10px; cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  nav button.on { color: var(--ink); border-bottom-color: var(--gold); }
  nav button .n { font-weight: 400; color: var(--muted); margin-left: 4px; }
  main { max-width: 1400px; margin: 0 auto; padding: 18px 16px 48px; }
  .note { color: var(--muted); font-size: 13px; margin-bottom: 16px; line-height: 1.5; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 18px 14px; }
  @media (max-width: 480px) { .grid { grid-template-columns: repeat(3, 1fr); gap: 14px 10px; } }
  figure { min-width: 0; }
  figure a { display: block; border-radius: 6px; overflow: hidden; background: var(--panel); aspect-ratio: 2 / 3; box-shadow: 0 6px 18px rgba(0,0,0,0.5); transition: transform 0.2s ease; }
  figure a:hover { transform: translateY(-3px); }
  figure img { width: 100%; height: 100%; object-fit: cover; display: block; }
  figcaption { margin-top: 7px; font-size: 12.5px; line-height: 1.3; }
  figcaption .y { color: var(--muted); }
  .tag { display: inline-block; margin-top: 3px; font-size: 10.5px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--gold); opacity: 0.8; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  /* Pop-up viewer */
  #lb { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center;
        background: rgba(6, 5, 4, 0.94); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); touch-action: pan-y; }
  #lb.open { display: flex; }
  #lb figure { display: flex; flex-direction: column; align-items: center; max-width: 92vw; }
  #lb-img { max-height: calc(100vh - 110px); max-width: 92vw; border-radius: 8px; box-shadow: 0 20px 60px rgba(0,0,0,0.7); background: var(--panel); }
  #lb-cap { margin-top: 12px; font-size: 15px; text-align: center; }
  #lb-cap .y, #lb-count { color: var(--muted); }
  #lb-count { font-size: 12px; margin-top: 4px; }
  .lb-btn { position: absolute; background: rgba(22, 20, 15, 0.7); border: 1px solid var(--line); color: var(--ink);
            width: 48px; height: 48px; border-radius: 50%; font-size: 26px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .lb-btn:hover { border-color: var(--gold); color: var(--gold); }
  #lb-prev { left: 16px; top: 50%; transform: translateY(-50%); }
  #lb-next { right: 16px; top: 50%; transform: translateY(-50%); }
  #lb-close { right: 16px; top: 16px; font-size: 22px; }
  @media (max-width: 600px) { #lb-prev, #lb-next { top: auto; bottom: 16px; transform: none; } }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Poster Gallery</h1>
    <input class="search" id="q" type="search" placeholder="Find a film…" aria-label="Find a film">
  </div>
  <nav id="tabs"></nav>
</header>
<main>
  <p class="note" id="note"></p>
  <div class="grid" id="grid"></div>
</main>
<div id="lb" aria-modal="true" role="dialog">
  <button class="lb-btn" id="lb-close" aria-label="Close">&times;</button>
  <button class="lb-btn" id="lb-prev" aria-label="Previous">&#8249;</button>
  <figure><img id="lb-img" alt=""><figcaption id="lb-cap"></figcaption><div id="lb-count"></div></figure>
  <button class="lb-btn" id="lb-next" aria-label="Next">&#8250;</button>
</div>

<script src="../../films-data.js"></script>
<script src="../../watchlist-posters.js"></script>
<script src="../../favourite-posters.js"></script>
<script src="../../retro-posters.js"></script>
<script src="../../collection-posters.js"></script>
<script src="../../show-posters.js"></script>
<script>
  const THUMB = "https://image.tmdb.org/t/p/w342/";
  const FULL = "https://image.tmdb.org/t/p/original/";

  function favourites() {
    return (typeof FAVOURITE_POSTERS === "undefined" ? [] : FAVOURITE_POSTERS)
      .map((f) => f.image
        ? { title: f.title, year: f.year, src: f.image + "?w=600", fullSrc: f.image, focus: f.focus }
        : { title: f.title, year: f.year, file: f.poster });
  }
  function watchlist() {
    if (typeof FILMS === "undefined") return [];
    const map = typeof WATCHLIST_POSTERS === "undefined" ? {} : WATCHLIST_POSTERS;
    return FILMS.map((f) => {
      const tl = map[f.slug];
      if (tl && tl.poster) return { title: f.title, year: f.year, file: tl.poster };
      return { title: f.title, year: f.year, src: f.poster, tag: "Letterboxd poster (no text-free one yet)" };
    });
  }
  function retro() {
    return (typeof RETRO_POSTERS === "undefined" ? [] : RETRO_POSTERS)
      .map((f) => ({ title: f.title, year: f.year, file: f.poster }));
  }

  function collection() {
    return (typeof COLLECTION_POSTERS === "undefined" ? [] : COLLECTION_POSTERS)
      .map((f) => ({ title: f.title, year: f.year, file: f.poster }));
  }

  function shows() {
    return (typeof SHOW_POSTERS === "undefined" ? [] : SHOW_POSTERS)
      .map((f) => ({ title: f.name, file: f.poster }));
  }

  const sections = [
    { id: "favourites", name: "Favourites", items: favourites(),
      note: "Your Letterboxd likes. These are the posters the TV rotates through, one every 5 minutes." },
    { id: "watchlist", name: "Watchlist", items: watchlist(),
      note: "Only shown when that film is playing in Plex. Text-free where TMDB has one." },
    { id: "retro", name: "Retro (unwatched)", items: retro(),
      note: "Unwatched films from your retro watchlist. Only shown when that film is playing in Plex." },
    { id: "collection", name: "Collection", items: collection(),
      note: "Films you own but don't want rotating (e.g. Spider-Man). Only shown when that film is playing in Plex." },
    { id: "shows", name: "Shows", items: shows(),
      note: "Your shows. Shown when an episode is playing in Plex. Text-free where TMDB has a sharp one." },
  ];

  let current = "favourites";
  try { current = localStorage.getItem("galleryTab") || current; } catch (e) {}
  if (!sections.some((s) => s.id === current)) current = "favourites";

  const tabs = document.getElementById("tabs");
  sections.forEach((s) => {
    const b = document.createElement("button");
    b.dataset.id = s.id;
    b.innerHTML = `${s.name}<span class="n">${s.items.length}</span>`;
    b.onclick = () => { current = s.id; try { localStorage.setItem("galleryTab", current); } catch (e) {} render(); };
    tabs.appendChild(b);
  });

  const q = document.getElementById("q");
  q.addEventListener("input", render);

  function render() {
    const s = sections.find((x) => x.id === current);
    [...tabs.children].forEach((b) => b.classList.toggle("on", b.dataset.id === current));
    document.getElementById("note").textContent = s.note;
    const term = q.value.trim().toLowerCase();
    const items = s.items.filter((i) => !term || i.title.toLowerCase().includes(term));
    const grid = document.getElementById("grid");
    grid.innerHTML = "";
    shown = items;
    if (!items.length) { grid.innerHTML = '<p class="empty">No films match.</p>'; return; }
    items.forEach((i, n) => {
      const thumb = i.file ? THUMB + i.file : i.src;
      const full = i.fullSrc || (i.file ? FULL + i.file : (i.src || "").replace(/-0-\d+-0-\d+-crop/, "-0-1000-0-1500-crop"));
      const fig = document.createElement("figure");
      const a = document.createElement("a");
      a.href = full; a.target = "_blank"; a.rel = "noopener";
      i.full = full;
      a.onclick = (e) => { if (e.ctrlKey || e.metaKey || e.shiftKey || e.button) return; e.preventDefault(); openLb(n); };
      const img = document.createElement("img");
      img.loading = "lazy"; img.alt = i.title; img.src = thumb; if (i.focus) img.style.objectPosition = i.focus + " 50%";
      a.appendChild(img);
      const cap = document.createElement("figcaption");
      cap.textContent = i.title + " ";
      const y = document.createElement("span"); y.className = "y"; y.textContent = i.year ? `(${i.year})` : "";
      cap.appendChild(y);
      if (i.tag) { const t = document.createElement("div"); t.className = "tag"; t.textContent = i.tag; cap.appendChild(t); }
      fig.append(a, cap);
      grid.appendChild(fig);
    });
  }

  // ---------- Pop-up viewer ----------
  let shown = [], at = 0;
  const lb = document.getElementById("lb"), lbImg = document.getElementById("lb-img");
  function thumbOf(i) { return i.file ? THUMB + i.file : i.src; }
  function showLb() {
    const i = shown[at];
    lbImg.src = thumbOf(i);                       // quick small version first
    const big = new Image();
    big.onload = () => { if (shown[at] === i) lbImg.src = i.full; };
    big.src = i.full;
    const cap = document.getElementById("lb-cap");
    cap.textContent = i.title + " ";
    const y = document.createElement("span"); y.className = "y"; y.textContent = i.year ? `(${i.year})` : "";
    cap.appendChild(y);
    document.getElementById("lb-count").textContent = `${at + 1} of ${shown.length}`;
    [-1, 1].forEach((d) => { const n = shown[(at + d + shown.length) % shown.length]; if (n) new Image().src = n.full; });
  }
  function openLb(n) { at = n; showLb(); lb.classList.add("open"); document.body.style.overflow = "hidden"; }
  function closeLb() { lb.classList.remove("open"); document.body.style.overflow = ""; lbImg.removeAttribute("src"); }
  function step(d) { if (!shown.length) return; at = (at + d + shown.length) % shown.length; showLb(); }
  document.getElementById("lb-prev").onclick = (e) => { e.stopPropagation(); step(-1); };
  document.getElementById("lb-next").onclick = (e) => { e.stopPropagation(); step(1); };
  document.getElementById("lb-close").onclick = closeLb;
  lb.onclick = (e) => { if (e.target === lb) closeLb(); };
  document.addEventListener("keydown", (e) => {
    if (!lb.classList.contains("open")) return;
    if (e.key === "ArrowLeft") step(-1);
    else if (e.key === "ArrowRight") step(1);
    else if (e.key === "Escape") closeLb();
  });
  let x0 = null;
  lb.addEventListener("touchstart", (e) => { x0 = e.touches[0].clientX; }, { passive: true });
  lb.addEventListener("touchend", (e) => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0; x0 = null;
    if (Math.abs(dx) > 40) step(dx < 0 ? 1 : -1);
  });
  render();
</script>
</body>
</html>
